<!DOCTYPE html>
<!--
=====================================================================
  末日之城 —— 方块风格 · 架炮守城打僵尸（Three.js r128 单文件，浏览器直接打开）
=====================================================================
【玩法】玩家在城墙上走动，选垛口架设炮台（重机枪 / 霰弹炮 / 火箭炮 / 反器材炮），
  招募村民当炮手自动操作，也可以亲手操控任意一座炮台。城墙耐久归零 = 城破。
【电脑操作】WASD 走动 · 鼠标看 · 右键望远镜 · Q 在脚下垛口建造（1-4 选类型）
  炮台旁：G 派炮手 · U 升级 · X 拆除（按两次）· F 亲手操控（A/D / 滚轮切换炮台，F/E 离开）
  T 命令炮手集火准星目标 · B 商店（修墙 / 工匠 / 炮手训练，波次之间）· N 立即开战 · Esc 暂停
【手机操作】左下摇杆走动 · 右半屏拖动视角 · 右侧按钮随情境出现（建造 / 派炮手 / 升级 / 操控 / 射击…）
【加新炮台】MOUNTS 里加一项 + Guns.model 里加外观即可。
-->

<style>

<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
'use strict';
if(!window.THREE){ document.getElementById('loaderr').style.display='flex'; throw new Error('no three'); }

/* =====================================================================
   0. 工具 & 配置
   ===================================================================== */
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const rand = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => v<a?a:v>b?b:v, lerp = (a,b,t) => a+(b-a)*t;
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
const SHADOWS = !IS_TOUCH;

const CFG = {
  wall: { half:44, top:6, front:2, hp:2000 },          // 城墙：x -44..44，顶面 y=6，正面 z=2
  walk: { x:42.5, zMin:-1.6, zMax:1.15, eye:1.65, speed:5, sprint:8.5 },
  spawnZ: [108, 126],
  prepTime: 30,
  startGold: 700,
  startPop: 12,
  gunSpacing: 4.8,      // 两座炮台之间的最小距离（= 隔一个垛口）
  gunZ: 1.15,           // 炮台在走道上的位置（靠外沿）
  pitchMin: -1.4, pitchMax: 0.3, yawMax: 1.45,
};
// 架设武器（炮台）。以后加新炮台只需在这里加一项 + Guns.model 里加外观
const MOUNTS = {
  mg:      { name:'重机枪',   key:1, price:300, dmg:14,  rate:0.08, pellets:1, spread:0.015, heat:0.05, range:200, color:0x4a5a3a, desc:'射速快，持续扫射；打久了会过热。' },
  shotgun: { name:'霰弹炮',   key:2, price:450, dmg:14,  rate:0.8,  pellets:8, spread:0.07,  heat:0.14, range:55,  color:0x6a4a2a, desc:'近距离一大片，专清墙根下的尸群。' },
  rocket:  { name:'火箭炮',   key:3, price:800, dmg:110, rate:1.6,  splash:3.8, speed:50,   heat:0.24, range:220, color:0x5a5a2a, desc:'爆炸范围伤害，炸开密集尸群。' },
  cannon:  { name:'反器材炮', key:4, price:700, dmg:200, rate:1.8,  pellets:1, spread:0.002, pierce:4, heat:0.2, range:300, color:0x3a4048, desc:'一发穿透多只，专克巨尸。右键瞄准。' },
};
const MOUNT_ORDER = ['mg','shotgun','rocket','cannon'];
const ZTYPES = {
  walker: { name:'行尸',   hp:80,  speed:1.5, dps:4,  gold:10, s:1.0,  c:{ skin:0x6f9e4a, shirt:0x3d6e8c, pants:0x34345a, eye:0xffd23a, hair:0x2a3a1a } },
  runner: { name:'疾行者', hp:50,  speed:3.8, dps:3,  gold:14, s:0.92, c:{ skin:0x93b85a, shirt:0x9a3b34, pants:0x4a3a2a, eye:0xff6a2a } },
  brute:  { name:'巨尸',   hp:650, speed:0.9, dps:18, gold:70, s:1.75, c:{ skin:0x4f7a34, shirt:0x5a4a3a, pants:0x2a2a3a, eye:0xff3030, hair:0x1a1a1a } },
};
const CREW = {
  gunner:   { name:'炮手', price:150, c:{ skin:0xd0a070, shirt:0x4a5a6a, pants:0x2a3038, hair:0x3a4048 } },
  engineer: { name:'工匠', price:250, repair:5, c:{ skin:0xe0b088, shirt:0xb86a2a, pants:0x4a3a2a, hair:0xd8b030 } },
};
const ENGINEER_SLOTS = [-30,-10,10,30];
const GUN_XS = []; for(let k=0;k<=34;k++) GUN_XS.push(+(-41.6+2.4*k).toFixed(1));   // 垛口之间的空位
const START_GUN_X = -0.8;

/* =====================================================================
   1. 音效（WebAudio 合成）
   ===================================================================== */
const Sfx = {
  ctx:null, master:null, nb:null, last:{},
  init(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.45; this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1, n, n); const d = this.nb.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    }catch(e){ this.ctx=null; }
  },
  noise(dur, f, vol, type='lowpass', q=0.8){
    if(!this.ctx) return; const c=this.ctx, t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.nb; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
  },
  tone(f1, f2, dur, vol, type='square'){
    if(!this.ctx) return; const c=this.ctx, t=c.currentTime;
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  throttle(k, gap){ const n=performance.now(); if(this.last[k] && n-this.last[k]<gap) return false; this.last[k]=n; return true; },
  shot(id, quiet){
    if(quiet && !this.throttle('q'+id, id==='mg'?90:40)) return;
    const k=quiet?0.3:1;
    if(id==='mg'){ this.noise(0.09,1600,0.45*k); this.tone(120,50,0.06,0.14*k); }
    else if(id==='shotgun'){ this.noise(0.35,1100,0.85*k); this.tone(100,40,0.2,0.28*k); }
    else if(id==='rocket'){ this.noise(0.5,700,0.6*k,'bandpass',1); this.tone(300,120,0.4,0.12*k,'sawtooth'); }
    else if(id==='cannon'){ this.noise(0.6,1500,0.95*k); this.tone(80,28,0.35,0.32*k); }
  },
  boom(){ this.noise(0.9,450,0.9); this.tone(80,25,0.7,0.4,'sine'); },
  build(){ this.noise(0.15,900,0.3); setTimeout(()=>this.noise(0.15,700,0.3),140); this.tone(500,700,0.12,0.08); },
  hit(){ if(this.throttle('hit',40)) this.noise(0.06,900,0.25,'bandpass',2); },
  kill(){ this.tone(300,80,0.15,0.08,'sawtooth'); },
  reload(){ this.tone(900,700,0.05,0.08); setTimeout(()=>this.tone(600,900,0.06,0.08),350); },
  empty(){ this.tone(1200,1100,0.03,0.08); },
  wallHit(){ if(this.throttle('wall',220)) { this.noise(0.15,300,0.35); this.tone(70,40,0.12,0.15,'sine'); } },
  groan(){ if(!this.ctx) return; this.tone(rand(90,140),rand(50,70),rand(0.6,1.1),0.05,'sawtooth'); },
  buy(){ this.tone(600,900,0.08,0.1); setTimeout(()=>this.tone(900,1300,0.1,0.1),80); },
  deny(){ this.tone(200,150,0.15,0.12); },

/* =====================================================================
   2. 材质 & 几何合并（干净低多边形：无贴图、无描边，顶点色 + 竖向明暗渐变）
   ===================================================================== */
const glowMat = c => new THREE.MeshBasicMaterial({ color:c });
const BLOCK_MAT = new THREE.MeshLambertMaterial({ vertexColors:true });
const STONE_MAT = BLOCK_MAT;
const GLOW_MAT  = new THREE.MeshBasicMaterial({ vertexColors:true });
const CHAR_MAT  = new THREE.MeshLambertMaterial({ vertexColors:true });

// 人字屋顶三棱柱：x 方向长 1，底宽（z）1，高 1，底面在 y=0
function prismGeo(){
  const A=[-.5,0,-.5],B=[-.5,0,.5],C=[-.5,1,0],D=[.5,0,-.5],E=[.5,0,.5],F=[.5,1,0];
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute([A,B,C, D,F,E, B,E,F, B,F,C, A,C,F, A,F,D, A,D,E, A,E,B].flat(),3)); return g;
}
const hash3 = (x,y,z,s) => { const v=Math.sin(x*127.1+y*311.7+z*74.7+s*19.3)*43758.5453; return v-Math.floor(v); };
// 一个形状 → 几何体。数组 [w,h,d,color,x,y,z] = 方块；对象 {g,s,c,p,r,seg,top,seed,jit} = 其他低多边形
function shapeGeo(e){
  if(Array.isArray(e)){ const g=new THREE.BoxGeometry(e[0],e[1],e[2]); g.translate(e[4],e[5],e[6]); return g; }
  let g;
  switch(e.g){
    case 'rock': {   // 不规则十二面体：同一位置的顶点按哈希偏移，保持封闭
      g=new THREE.DodecahedronGeometry(1,0); const p=g.attributes.position, sd=e.seed??Math.random()*99, j=e.jit??0.22;
      for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i), rx=Math.round(x*100),ry=Math.round(y*100),rz=Math.round(z*100);
        p.setXYZ(i, x*(1+(hash3(rx,ry,rz,sd)-0.5)*j*2), y*(1+(hash3(ry,rz,rx,sd)-0.5)*j*2), z*(1+(hash3(rz,rx,ry,sd)-0.5)*j*2)); }
      break; }
    case 'cone': g=new THREE.ConeGeometry(1,1,e.seg||7); break;
    case 'cyl':  g=new THREE.CylinderGeometry(e.top??1,1,1,e.seg||6); break;
    case 'roof': g=prismGeo(); break;
    default: g=new THREE.BoxGeometry(1,1,1);
  }
  const sc=e.s||[1,1,1]; g.scale(sc[0],sc[1],sc[2]);
  if(e.r){ g.rotateX(e.r[0]); g.rotateY(e.r[1]); g.rotateZ(e.r[2]); }
  g.translate(e.p[0],e.p[1],e.p[2]); return g;
}
// 合并一组形状 → 一个带顶点色的几何体（1 次绘制）。ao：每个形状底部变暗的程度（假环境光遮蔽）
function mergeBoxes(list, _unused=0, ao=0.22){
  const pos=[], col=[], c=new THREE.Color();
  for(const e of list){
    let g=shapeGeo(e); if(g.index) g=g.toNonIndexed();
    c.setHex(Array.isArray(e)?e[3]:e.c);
    const p=g.attributes.position; let y0=Infinity,y1=-Infinity;
    for(let i=0;i<p.count;i++){ const y=p.getY(i); if(y<y0) y0=y; if(y>y1) y1=y; }
    for(let i=0;i<p.count;i++){ const y=p.getY(i), t=y1>y0?(y-y0)/(y1-y0):1, k=1-ao+ao*1.15*t;
      pos.push(p.getX(i),y,p.getZ(i)); col.push(c.r*k,c.g*k,c.b*k); }
    g.dispose();
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.computeVertexNormals(); geo.computeBoundingSphere(); return geo;
}
const varyCol = (hex, v=0.08) => { const c=new THREE.Color(hex), k=1-Math.random()*v; return c.setRGB(c.r*k,c.g*k,c.b*k).getHex(); };

(function sky(){
  const g=new THREE.SphereGeometry(400,32,16), p=g.attributes.position, cols=[], c=new THREE.Color();
  const H=new THREE.Color(0xe8834a), M=new THREE.Color(0x6a3e6a), T=new THREE.Color(0x141a3a), B=new THREE.Color(FOG_COL);
  for(let i=0;i<p.count;i++){

    const warm = clamp(0.5+z*0.5,0,1);                       // 太阳一侧（+z）更暖
    if(y<0) c.copy(B);
    else if(y<0.22){ c.copy(new THREE.Color(FOG_COL).lerp(H, warm)).lerp(M, y/0.22*0.8); }
    else c.copy(M).lerp(T, clamp((y-0.22)/0.6,0,1));

  const sp=[]; for(let i=0;i<300;i++){ const a=Math.random()*Math.PI*2, e=rand(0.3,1.4); sp.push(Math.cos(a)*Math.cos(e)*390, Math.sin(e)*390, Math.sin(a)*Math.cos(e)*390); }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  dome.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:0.7})));
})();

    p.setXYZ(0,a.x,a.y,a.z); p.setXYZ(1,b.x,b.y,b.z); p.needsUpdate=true; t.l.material.color.setHex(color); t.life=0.07; t.l.material.opacity=0.9;
  },

    }

  list:[], marked:null, markMesh:null,

    this.markMesh.renderOrder=10; this.markMesh.visible=false; scene.add(this.markMesh);
  },
  spawn(type, wave){
    const T=ZTYPES[type], h=buildHuman(humanGeos(T.c), T.s);
    const xr=40*Math.min(1,0.45+0.11*wave), x=rand(-xr,xr), z=rand(CFG.spawnZ[0],CFG.spawnZ[1]);
    h.root.position.set(x,0,z); h.root.rotation.y=Math.PI; scene.add(h.root);
    h.armL.rotation.x=h.armR.rotation.x=-Math.PI/2+0.15;
    const hpMul=1+0.12*(wave-1);
    this.list.push({ type, T, h, s:T.s, hp:T.hp*hpMul, maxHp:T.hp*hpMul, speed:T.speed*rand(0.85,1.15)*(1+0.02*wave), x, ph:Math.random()*6,
      state:'walk', atkZ: CFG.wall.front+0.45*T.s+rand(0,0.7), dead:0, alive:true, wob:rand(0,6), groan:rand(3,12) });
  },
  update(dt){
    let attackers=0;
    for(const z of this.list){
      const p=z.h.root.position;
      if(!z.alive){
        z.dead+=dt; const k=Math.min(1,z.dead/0.45);
        z.h.root.rotation.x=-k*Math.PI/2*z.fallDir; if(z.dead>2) p.y-=dt*0.6;
        continue;
      }
      z.groan-=dt; if(z.groan<0){ z.groan=rand(6,16); if(p.z<70) Sfx.groan(); }
      if(z.state==='walk'){
        z.ph+=dt*z.speed*3.2; animWalk(z.h,z.ph,0.55); z.h.armL.rotation.x=-Math.PI/2+0.15+Math.sin(z.ph)*0.15; z.h.armR.rotation.x=-Math.PI/2+0.15-Math.sin(z.ph)*0.15;
        p.z-=z.speed*dt; p.x+=Math.sin(z.ph*0.3+z.wob)*0.25*dt;
        z.h.root.rotation.y=Math.PI+Math.sin(z.ph*0.3+z.wob)*0.12;
        if(p.z<=z.atkZ){ p.z=z.atkZ; z.state='attack'; z.ph=0; }
      } else {
        attackers++;
        z.ph+=dt*(z.type==='brute'?3:6);
        const sw=Math.sin(z.ph); z.h.armL.rotation.x=-Math.PI/2-0.6+sw*0.6; z.h.armR.rotation.x=-Math.PI/2-0.6-sw*0.6; animLegsIdle(z.h);
        z.h.root.rotation.y=Math.PI;
        Wall.damage(z.T.dps*dt*(1+0.04*(Game.wave-1)));
        if(Math.random()<dt*2) Sfx.wallHit();
        if(z.type==='brute' && Math.random()<dt*1.5){ Fx.burst(new V3(p.x,rand(0.5,2.5),CFG.wall.front+0.1),0xa09888,3,2,0.15); Game.shake=Math.max(Game.shake,0.08); }
      }
    }
    // 简单分离，防止挤成一团
    const L=this.list;
    for(let i=0;i<L.length;i++){ const a=L[i]; if(!a.alive) continue; const pa=a.h.root.position;
      for(let j=i+1;j<L.length;j++){ const b=L[j]; if(!b.alive) continue; const pb=b.h.root.position;
        const dx=pb.x-pa.x, dz=pb.z-pa.z, r=0.42*(a.s+b.s), d2=dx*dx+dz*dz; if(d2>r*r||d2<1e-6) continue;
        const d=Math.sqrt(d2), push=(r-d)*0.5, nx=dx/d; pa.x-=nx*push; pb.x+=nx*push;
        if(a.state==='walk') pa.z-= (dz/d)*push*0.5; if(b.state==='walk') pb.z+=(dz/d)*push*0.5;
      }
      pa.x=clamp(pa.x,-43,43);
    }
    // 清理
    for(let i=L.length-1;i>=0;i--){ const z=L[i]; if(!z.alive && z.dead>3.5){ scene.remove(z.h.root); L.splice(i,1); } }
    if(this.marked && !this.marked.alive) this.marked=null;
    this.markMesh.visible=!!this.marked;
    if(this.marked){ const p=this.marked.h.root.position; this.markMesh.position.set(p.x,p.y+2.4*this.marked.s+Math.sin(performance.now()/150)*0.15,p.z); this.markMesh.rotation.y+=dt*4; }
    return attackers;
  },
  aliveCount(){ let n=0; for(const z of this.list) if(z.alive) n++; return n; },
  // 射线检测：返回按距离排序的命中 {z, t, head}
  raycast(o, d, max){
    const hits=[];
    for(const z of this.list){
      if(!z.alive) continue; const p=z.h.root.position, s=z.s;
      const th=rayBox(o,d,p.x,p.y+1.68*s,p.z,0.27*s,0.27*s,0.27*s);
      const tb=rayBox(o,d,p.x,p.y+0.73*s,p.z+0.1*s,0.34*s,0.73*s,0.4*s);
      if(th>=0 && th<=max && (tb<0 || th<=tb+0.3)) hits.push({z,t:th,head:true});

  },
  damage(z, dmg, head, point, by){

    if(z.hp<=0){
      z.alive=false; z.fallDir=1; Game.kills++;
      const g=Math.round(z.T.gold*(1+0.03*Game.wave)); Game.addGold(g);
      Fx.burst(point,0x5a8a2a,10,3,0.14); if(by==='player') Sfx.kill();

};
function animLegsIdle(h){ h.legL.rotation.x*=0.9; h.legR.rotation.x*=0.9; }
function rayBox(o,d,cx,cy,cz,hx,hy,hz){
  let tmin=-Infinity,tmax=Infinity;
  const ax=[[o.x,d.x,cx-hx,cx+hx],[o.y,d.y,cy-hy,cy+hy],[o.z,d.z,cz-hz,cz+hz]];
  for(const [oo,dd,lo,hi] of ax){
    if(Math.abs(dd)<1e-8){ if(oo<lo||oo>hi) return -1; continue; }
    let t1=(lo-oo)/dd, t2=(hi-oo)/dd; if(t1>t2){ const s=t1; t1=t2; t2=s; }
    if(t1>tmin) tmin=t1; if(t2<tmax) tmax=t2; if(tmin>tmax) return -1;
  }
  return tmax<0?-1:Math.max(0,tmin);
}

function groundPoint(o,d,max){ if(d.y<-0.001){ const t=-o.y/d.y; if(t<max) return o.clone().addScaledVector(d,t); } return o.clone().addScaledVector(d,max); }
function groundEnd(o,d,max){ const e=groundPoint(o,d,max); if(e.y<0.05) Fx.burst(e,0x6a5a40,3,1.8,0.09); return e; }
// 目标选择：集火标记优先，否则离城墙最近（威胁最大）的；preferBig = 优先巨尸
function pickTarget(from, range, filter, preferBig){
  const m=Zombies.marked;
  if(m && m.alive && m.h.root.position.distanceTo(from)<range && (!filter||filter(m))) return m;
  let best=null, bs=Infinity;
  for(const z of Zombies.list){
    if(!z.alive) continue; const p=z.h.root.position; if(p.z>CFG.spawnZ[0]-5) continue;
    const d=p.distanceTo(from); if(d>range || (filter && !filter(z))) continue;
    const sc=p.z - (preferBig && z.type==='brute'?40:0);
    if(sc<bs){ bs=sc; best=z; }
  }
  return best;
}

      for(const h of hits){ if(left<=0) break; const p=aimO.clone().addScaledVector(d,h.t); const fo=M.pellets>1?clamp(1.3-h.t/M.range,0.35,1):1;
        Zombies.damage(h.z,dmg*fo,h.head,p,by); hitAny=true; end=p; left--; }
      if(!end || (M.pierce && left>0)) end=groundEnd(aimO,d,M.range);
      if(i<4) Fx.tracer(m,end,M.pierce?0xc0e0ff:0xffc060);
    }
    if(hitAny && !auto){ Sfx.hit(); Game.hitmark(); }
    return true;
  },
  update(dt){
    for(const t of this.list){
      t.cd-=dt; t.flashT-=dt; t.flash.visible=t.flashT>0; if(t.flash.visible) t.flash.rotation.z=Math.random()*3;
      t.heat=Math.max(0,t.heat-0.32*(1+0.15*(t.lvl-1))*dt); if(t.over && t.heat<0.35) t.over=false;
      if(!this.isControlled(t) && t.gunner && Game.state==='combat'){
        const piv=new V3(t.x,CFG.wall.top+1.15,CFG.gunZ);
        const tz=pickTarget(piv, t.M.range*0.8, z=>{ const p=z.h.root.position; return Math.abs(Math.atan2(p.x-t.x,p.z-CFG.gunZ))<CFG.yawMax; }, t.type==='cannon'||t.type==='rocket');
        if(tz){
          const p=tz.h.root.position, aim=new V3(p.x,p.y+0.9*tz.s,p.z);
          if(t.M.splash && tz.state==='walk') aim.z-=tz.speed*aim.distanceTo(piv)/t.M.speed;   // 火箭打提前量
          const dx=aim.x-t.x, dz=aim.z-CFG.gunZ, dy=aim.y-piv.y;
          const wy=Math.atan2(dx,dz), wp=clamp(Math.atan2(dy,Math.hypot(dx,dz)),CFG.pitchMin,CFG.pitchMax), rate=2.2*(1+0.3*this.crewLvl);
          t.yaw+=clamp(wy-t.yaw,-rate*dt,rate*dt); t.pitch+=clamp(wp-t.pitch,-rate*dt,rate*dt);
          if(Math.abs(wy-t.yaw)<0.06 && Math.abs(wp-t.pitch)<0.08 && !t.over && t.heat<0.85) this.fire(t,piv,dirFrom(t.yaw,t.pitch),true);
        }
      }
      t.yaw=clamp(t.yaw,-CFG.yawMax,CFG.yawMax);
      t.yawG.rotation.y=t.yaw; t.pitchG.rotation.x=-t.pitch;
      if(t.gunner){ const g=t.gunner.h; g.root.rotation.y=t.yaw*0.6; g.root.visible=!this.isControlled(t); }
    }
  },
  clear(){ for(const t of this.list){ scene.remove(t.root); if(t.gunner) scene.remove(t.gunner.h.root); } this.list.length=0; this.crewLvl=0; }
};

/* 火箭弹 */
const Rockets = {
  list:[], geo:new THREE.BoxGeometry(0.18,0.18,0.55), mat:new THREE.MeshBasicMaterial({color:0xd8d0b0}),
  launch(p,d,speed,dmg,r,by){
    const m=new THREE.Mesh(this.geo,this.mat); m.position.copy(p); scene.add(m);
    this.list.push({ m, v:d.clone().multiplyScalar(speed), dmg, r, by, life:5, trail:0 });
  },
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){
      const q=this.list[i], p=q.m.position; q.life-=dt; q.v.y-=1.5*dt; p.addScaledVector(q.v,dt);
      q.m.lookAt(p.clone().add(q.v));
      q.trail-=dt; if(q.trail<=0){ q.trail=0.02; Fx.burst(p,0xb0aaa0,1,0.3,0.16,-0.05); }
      let hit = p.y<=0.15 || q.life<=0;
      if(!hit) for(const z of Zombies.list){ if(!z.alive) continue; const zp=z.h.root.position; if(Math.abs(zp.x-p.x)<0.5*z.s+0.2 && Math.abs(zp.z-p.z)<0.5*z.s+0.2 && p.y<zp.y+1.9*z.s){ hit=true; break; } }
      if(hit){ this.explode(q); scene.remove(q.m); this.list.splice(i,1); }
    }
  },
  explode(q){
    const p=q.m.position;
    for(const z of Zombies.list){
      if(!z.alive) continue; const zp=z.h.root.position, c=new V3(zp.x,zp.y+0.9*z.s,zp.z), d=c.distanceTo(p);
      if(d<q.r+0.4*z.s) Zombies.damage(z,q.dmg*clamp(1.15-d/(q.r+0.5),0.25,1),false,c,q.by);
    }
    Fx.burst(p,0xff8a20,16,6,0.28,0.4); Fx.burst(p,0x4a4440,12,3.5,0.32,0.1); Fx.burst(p,0xffe070,6,8,0.12,0.6);
    Sfx.boom(); Game.shake=Math.max(Game.shake,0.04+0.14*clamp(1-p.distanceTo(camera.position)/60,0,1));
  },
  clear(){ for(const q of this.list) scene.remove(q.m); this.list.length=0; }
};

const Player = {
  pos:new V3(4,CFG.wall.top,0), yaw:0, pitch:-0.08, mode:'walk', gunIdx:0, bob:0, delArm:0,
  reset(){ this.pos.set(4,CFG.wall.top,0); this.yaw=0; this.pitch=-0.08; this.mode='walk'; this.gunIdx=0; },
  spotX(){ let best=GUN_XS[0]; for(const x of GUN_XS) if(Math.abs(x-this.pos.x)<Math.abs(best-this.pos.x)) best=x; return best; },
  nearGun(){ return this.mode==='walk' ? Guns.near(this.pos.x) : null; },
  enterGun(){
    if(!Guns.list.length){ HUD.toast('还没有炮台：按 Q 先建一座'); return; }
    let i=0, bd=Infinity; Guns.list.forEach((t,k)=>{ const d=Math.abs(t.x-this.pos.x); if(d<bd){ bd=d; i=k; } });
    this.gunIdx=i; this.mode='gun'; Build.close(); HUD.bar();
  },
  exitGun(){ this.mode='walk'; HUD.bar(); },
  switchGun(dir){ if(this.mode!=='gun'||!Guns.list.length) return; this.gunIdx=(this.gunIdx+dir+Guns.list.length)%Guns.list.length; HUD.bar(); },
  look(dx,dy){
    if(this.mode==='gun'){ const t=Guns.list[this.gunIdx]; if(!t) return; const k=Input.state().aim && t.type==='cannon'?0.4:1;
      t.yaw=clamp(t.yaw-dx*k,-CFG.yawMax,CFG.yawMax); t.pitch=clamp(t.pitch-dy*k,CFG.pitchMin,CFG.pitchMax); }
    else { this.yaw-=dx; this.pitch=clamp(this.pitch-dy,-1.45,1.4); }
  },
  update(dt, input){
    if(this.mode==='gun'){
      const t=Guns.list[this.gunIdx]; if(!t){ this.exitGun(); return; }
      const d=dirFrom(t.yaw,t.pitch), piv=new V3(t.x,CFG.wall.top+1.15,CFG.gunZ);
      camera.position.copy(piv).addScaledVector(d,-2.3).add(new V3(0,0.75,0));
      camera.lookAt(camera.position.clone().addScaledVector(d,10).add(new V3(0,-0.22,0)));
      const tf=input.aim? (t.type==='cannon'?24:50) : 65; camera.fov=lerp(camera.fov,tf,dt*10); camera.updateProjectionMatrix();
      if(input.fire){ const cd=new V3(); camera.getWorldDirection(cd); Guns.fire(t,camera.position.clone(),cd,false); }
      return;
    }
    const sp=input.sprint?CFG.walk.sprint:CFG.walk.speed;
    const f=new V3(Math.sin(this.yaw),0,Math.cos(this.yaw)), r=new V3(-Math.cos(this.yaw),0,Math.sin(this.yaw));
    const mv=new V3().addScaledVector(f,input.my).addScaledVector(r,input.mx), ml=mv.length();
    if(ml>0.01){ mv.multiplyScalar(Math.min(1,ml)/ml*sp*dt); this.pos.add(mv); this.bob+=dt*sp*1.6*Math.min(1,ml); }
    this.pos.x=clamp(this.pos.x,-CFG.walk.x,CFG.walk.x); this.pos.z=clamp(this.pos.z,CFG.walk.zMin,CFG.walk.zMax);
    camera.position.set(this.pos.x,this.pos.y+CFG.walk.eye+Math.sin(this.bob*2)*0.04*Math.min(1,ml),this.pos.z);
    camera.lookAt(camera.position.clone().add(dirFrom(this.yaw,this.pitch)));
    camera.fov=lerp(camera.fov,input.aim?40:72,dt*10); camera.updateProjectionMatrix();   // 右键 = 望远镜
    this.delArm-=dt;
  },
};

addEventListener('keydown',e=>{
  if(Game.state==='title') return;
  Input.keys[e.code]=true;
  if(e.code==='Tab') e.preventDefault();
  if(Game.state==='over'||Game.paused||e.repeat) return;
  if(e.code==='KeyB'){ Shop.toggle(!Shop.open); return; }
  if(Shop.open){ if(e.code==='KeyN'){ Shop.toggle(false); Game.startCombat(); } if(e.code==='Escape') Shop.toggle(false); return; }
  if(e.code==='KeyN' && Game.state==='prep') Game.startCombat();
  if(e.code==='KeyF') Player.mode==='gun'?Player.exitGun():Player.enterGun();
  if(e.code==='KeyT') Game.mark();
  if(Player.mode==='gun'){
    if(e.code==='KeyA'||e.code==='ArrowLeft') Player.switchGun(-1);
    if(e.code==='KeyD'||e.code==='ArrowRight') Player.switchGun(1);
    if(e.code==='KeyE') Player.exitGun();
    return;
  }
  if(e.code==='KeyQ') Build.toggle();
  if(Build.isOpen && /^Digit[1-4]$/.test(e.code)){ const k=MOUNT_ORDER.find(k=>MOUNTS[k].key===+e.code[5]); if(k) Build.choose(k); return; }
  if(e.code==='KeyG') Act.crew();
  if(e.code==='KeyU') Act.upgrade();
  if(e.code==='KeyX') Act.remove();
});
addEventListener('keyup',e=>{ Input.keys[e.code]=false; });
addEventListener('mousemove',e=>{ if(document.pointerLockElement && Game.playing()) Player.look(e.movementX*0.0022*Input.sens, e.movementY*0.0022*Input.sens); });
renderer.domElement.addEventListener('mousedown',e=>{
  if(IS_TOUCH) return; Sfx.init();
  if(!document.pointerLockElement){ Game.lock(); return; }
  if(e.button===0) Input.mouse.l=true; if(e.button===2) Input.mouse.r=true;
});
addEventListener('mouseup',e=>{ if(e.button===0) Input.mouse.l=false; if(e.button===2) Input.mouse.r=false; });
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{ if(Game.playing() && Player.mode==='gun') Player.switchGun(e.deltaY>0?1:-1); });
document.addEventListener('pointerlockchange',()=>{
  if(!document.pointerLockElement && Game.playing() && !Shop.open && !IS_TOUCH) Game.setPaused(true);
  Input.mouse.l=Input.mouse.r=false;
});
addEventListener('blur',()=>{ Input.keys={}; Input.mouse.l=Input.mouse.r=false; if(Game.playing() && !Shop.open) Game.setPaused(true); });

function setupTouch(){
  $('touch').style.display='block';
  const joy=$('joy'), knob=$('knob');
  const moveJoy=t=>{ const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; let dx=(t.clientX-cx)/(r.width/2), dy=(t.clientY-cy)/(r.height/2); const l=Math.hypot(dx,dy); if(l>1){dx/=l;dy/=l;}
    Input.joy.x=dx; Input.joy.y=dy; knob.style.transform=`translate(${dx*45}px,${dy*45}px)`; Input.keys.ShiftLeft=l>0.95; };
  joy.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; Input.joy.id=t.identifier; moveJoy(t); },{passive:false});
  const btn=(id,down,up)=>{ const b=$(id); b.addEventListener('touchstart',e=>{ e.preventDefault(); Sfx.init(); down(); },{passive:false}); if(up) b.addEventListener('touchend',e=>{ e.preventDefault(); up(); },{passive:false}); };
  btn('tFire',()=>Input.touchFire=true,()=>Input.touchFire=false);
  btn('tAim',()=>Input.touchAim=!Input.touchAim);
  btn('tCtrl',()=>Player.mode==='gun'?Player.exitGun():Player.enterGun());
  btn('tSw',()=>Player.switchGun(1));
  btn('tBuild',()=>Build.toggle());
  btn('tCrew',()=>Act.crew());
  btn('tUp',()=>Act.upgrade());
  btn('tDel',()=>Act.remove());
  btn('tMark',()=>Game.mark());
  btn('tShop',()=>Shop.toggle(true));
  btn('tStart',()=>Game.startCombat());
  btn('tPause',()=>Game.setPaused(true));
  addEventListener('touchstart',e=>{ for(const t of e.changedTouches){ if(t.target.closest && t.target.closest('.tb,#joy,.screen,#buildMenu')) continue; if(t.clientX>innerWidth*0.35 && Input.lookId===null){ Input.lookId=t.identifier; Input.lx=t.clientX; Input.ly=t.clientY; } } },{passive:true});
  addEventListener('touchmove',e=>{ for(const t of e.changedTouches){
    if(t.identifier===Input.joy.id) moveJoy(t);
    else if(t.identifier===Input.lookId){ if(Game.playing()) Player.look((t.clientX-Input.lx)*0.0042*Input.sens,(t.clientY-Input.ly)*0.0042*Input.sens); Input.lx=t.clientX; Input.ly=t.clientY; }
  } },{passive:true});
  const end=e=>{ for(const t of e.changedTouches){ if(t.identifier===Input.joy.id){ Input.joy.id=null; Input.joy.x=Input.joy.y=0; knob.style.transform=''; Input.keys.ShiftLeft=false; } if(t.identifier===Input.lookId) Input.lookId=null; } };
  addEventListener('touchend',end); addEventListener('touchcancel',end);
}

/* =====================================================================
   15. 游戏流程（准备 → 战斗 → 准备 … → 城破）
   ===================================================================== */
const Game = {
  state:'title', paused:false, wave:1, timer:0, gold:0, pop:0, kills:0, queue:[], spawnT:0, shake:0, hitT:0, time:0,
  playing(){ return (this.state==='prep'||this.state==='combat') && !this.paused && !Shop.open; },
  lock(){ if(IS_TOUCH) return; try{ const p=renderer.domElement.requestPointerLock(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} },
  reset(){
    Zombies.clear(); Crew.clear(); Guns.clear(); Rockets.clear(); Build.close(); Wall.reset(); Player.reset();
    Guns.build('mg',START_GUN_X);
    this.wave=1; this.gold=CFG.startGold; this.pop=CFG.startPop; this.kills=0; this.queue=[]; Shop.open=false;
    $('shop').classList.remove('show'); $('over').classList.remove('show'); $('pause').classList.remove('show');
    HUD.bar(); this.startPrep(true);
  },
  start(){
    Sfx.init(); $('title').classList.remove('show'); $('hud').style.display='block';
    if(IS_TOUCH){ setupTouch(); try{ document.documentElement.requestFullscreen?.().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{}); }catch(e){} }
    this.reset(); this.lock();
  },
  startPrep(first){
    this.state='prep'; this.timer=first?60:CFG.prepTime;
    HUD.announce(first?'守住城墙！':`第 ${this.wave-1} 波已击退`, first?`沿着城墙选位置建炮台（${K('Q','建造')}），再派炮手操作（${K('G','派炮手')}）`:'继续加固防线');
  },
  startCombat(){
    if(this.state!=='prep') return;
    if(Shop.open) Shop.toggle(false);
    this.state='combat'; const w=this.wave;
    const total=Math.round(8+w*5+w*w*0.4), q=[];
    const brutes=w>=3?Math.floor((w-1)/2):0, runners=w>=2?Math.floor(total*Math.min(0.45,0.08*w)):0;
    for(let i=0;i<total-brutes-runners;i++) q.push('walker'); for(let i=0;i<runners;i++) q.push('runner'); for(let i=0;i<brutes;i++) q.push('brute');
    for(let i=q.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [q[i],q[j]]=[q[j],q[i]]; }
    this.queue=q; this.spawnT=1; Sfx.horn();
    HUD.announce(`第 ${w} 波`, `${total} 只僵尸来袭${brutes?` · 其中 ${brutes} 只巨尸`:''}`);
  },
  remaining(){ return this.queue.length+Zombies.aliveCount(); },
  endCombat(){
    const bonus=80+25*this.wave, refugees=this.wave%2===0?2:1;
    this.gold+=bonus; this.pop+=refugees; this.wave++;
    this.startPrep(false); HUD.toast(`清除奖励 +${bonus} 金 · ${refugees} 名难民加入村庄`);
  },
  addGold(g){ this.gold+=g; if(Build.isOpen) Build.render(); },
  hitmark(){ this.hitT=0.12; },
  mark(){
    const o=camera.position.clone(), d=new V3(); camera.getWorldDirection(d);
    let z=Zombies.raycast(o,d,300)[0]?.z;
    if(!z){ let best=0.06; for(const q of Zombies.list){ if(!q.alive) continue; const v=q.h.root.position.clone().add(new V3(0,q.s,0)).sub(o); const a=v.angleTo(d); if(a<best){ best=a; z=q; } } }
    if(z){ Zombies.marked=z; HUD.toast(`集火：${z.T.name}`); Sfx.tone(800,1200,0.12,0.1); } else HUD.toast('准星对准一只僵尸再下令');
  },
  setPaused(v){
    if(this.state==='over'||this.state==='title') return;
    this.paused=v; $('pause').classList.toggle('show',v); if(!v) this.lock();
  },
  gameOver(){
    if(this.state==='over') return; this.state='over'; if(Player.mode==='gun') Player.exitGun(); Build.close();
    if(document.pointerLockElement) document.exitPointerLock();
    $('overTxt').innerHTML=`坚守到第 <b>${this.wave}</b> 波 · 击杀 <b>${this.kills}</b> 只僵尸`; setTimeout(()=>$('over').classList.add('show'),1200);
    HUD.announce('城墙被攻破！','',2500);
  },
  update(dt){
    this.time+=dt;
    if(this.state==='prep'){ this.timer-=dt; if(this.timer<=0) this.startCombat(); }
    if(this.state==='combat'){
      this.spawnT-=dt;
      if(this.queue.length && this.spawnT<=0 && Zombies.aliveCount()<70){ Zombies.spawn(this.queue.pop(),this.wave); this.spawnT=Math.max(0.25,1.5-this.wave*0.09)*rand(0.5,1.3); }
      if(!this.queue.length && Zombies.aliveCount()===0) this.endCombat();
    }
    Player.update(dt,Input.state());
    Guns.update(dt); Crew.update(dt); Rockets.update(dt); Zombies.update(dt); World.update(dt,this.time); Fx.update(dt); Build.update();
    Wall.flash-=dt; this.hitT-=dt; $('cross').classList.toggle('hit',this.hitT>0);
    if(this.shake>0){ this.shake-=dt*0.5; camera.position.x+=rand(-1,1)*this.shake*0.5; camera.position.y+=rand(-1,1)*this.shake*0.5; }
    HUD.update();
  },
};
$('startBtn').onclick=()=>Game.start();
$('resumeBtn').onclick=()=>Game.setPaused(false);
$('restartBtn').onclick=()=>{ Game.setPaused(false); Game.reset(); };
$('againBtn').onclick=()=>{ Game.reset(); Game.lock(); };
$('sens').oninput=e=>Input.sens=+e.target.value;
$('ctrlText').innerHTML = IS_TOUCH
  ? '左下摇杆：在城墙上走动，选位置<br>「建造」架设炮台：重机枪 / 霰弹炮 / 火箭炮 / 反器材炮<br>走到炮台旁：「派炮手」让村民来操作，「升级」「拆除」<br>「操控」亲手开炮 · 「集火」命令所有炮手攻击准星目标'
  : 'WASD 在城墙上走动 · 鼠标看 · 右键望远镜<br><b>Q</b> 在脚下的垛口建炮台：重机枪 / 霰弹炮 / 火箭炮 / 反器材炮<br>走到炮台旁：<b>G</b> 派炮手操作 · <b>U</b> 升级 · <b>X</b> 拆除<br><b>F</b> 亲手操控炮台（A/D 切换）· <b>T</b> 命令炮手集火 · <b>B</b> 商店 · <b>N</b> 开战 · Esc 暂停';

/* =====================================================================
   16. 启动
   ===================================================================== */
World.build(); Fx.init(); Zombies.init(); Build.init(); Player.reset(); Guns.build('mg',START_GUN_X);
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(Game.state==='title'){ const t=now/1000; camera.position.set(Math.sin(t*0.05)*25,13,-8); camera.lookAt(Math.sin(t*0.05)*10,3,60); World.update(dt,t); }
  else if(Game.state==='over'){ World.update(dt,Game.time); Zombies.update(dt); Rockets.update(dt); Fx.update(dt); }
  else if(!Game.paused && !Shop.open) Game.update(dt);
  else if(Shop.open){ Game.time+=dt; World.update(dt,Game.time); HUD.update(); }
  camera.userData.dome.position.copy(camera.position);
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
window.CityDebug={ Game, Zombies, Wall, Player, Guns, Crew, Build };
</script>
